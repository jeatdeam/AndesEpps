<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1650 1000" width="1650" height="1000" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="fondo" x1="0.33" y1="0" x2="0.67" y2="1">
      <stop offset="0" stop-color="#d6ecf8"/>
      <stop offset=".35" stop-color="#e6f4fb"/>
      <stop offset=".7" stop-color="#f3f9fd"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <g id="guante">
      <!-- dedos y palma con recubrimiento -->
      <rect x="1030" y="300" width="56" height="240" rx="28" fill="#0369a1"/>
      <rect x="1094" y="262" width="56" height="280" rx="28" fill="#0369a1"/>
      <rect x="1158" y="276" width="56" height="266" rx="28" fill="#0369a1"/>
      <rect x="1222" y="320" width="52" height="220" rx="26" fill="#0369a1"/>
      <rect x="950" y="500" width="58" height="180" rx="29" fill="#0369a1" transform="rotate(-32 979 680)"/>
      <rect x="1022" y="460" width="258" height="250" rx="44" fill="#0369a1"/>
      <!-- tejido sin recubrir -->
      <rect x="1022" y="600" width="258" height="110" rx="20" fill="#cbd5e1"/>
      <rect x="1036" y="690" width="230" height="120" rx="18" fill="#e2e8f0"/>
      <path d="M1052 712 V790 M1080 712 V790 M1108 712 V790 M1136 712 V790 M1164 712 V790 M1192 712 V790 M1220 712 V790 M1248 712 V790" stroke="#94a3b8" stroke-width="5"/>
      <path d="M1046 330 V420 M1110 296 V400" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity=".35"/>
    </g>
  </defs>
  <rect width="1650" height="1000" fill="url(#fondo)"/>
  <circle cx="1170" cy="530" r="320" fill="#ffffff" opacity=".55"/>

  <!-- par de guantes -->
  <ellipse cx="1200" cy="830" rx="250" ry="22" fill="#0f172a" opacity=".12"/>
  <use href="#guante" transform="translate(140 30)" opacity=".45"/>
  <use href="#guante"/>

  <!-- promocion -->
  <rect x="1300" y="230" width="200" height="110" rx="24" fill="#dc2626"/>
  <text x="1400" y="282" text-anchor="middle" font-size="44" font-weight="700" fill="#ffffff">3 x 2</text>
  <text x="1400" y="318" text-anchor="middle" font-size="22" font-weight="700" fill="#fee2e2">en pares</text>

  <!-- texto -->
  <rect x="230" y="230" width="300" height="48" rx="24" fill="#0f172a"/>
  <text x="380" y="263" text-anchor="middle" font-size="22" font-weight="700" letter-spacing="4" fill="#ffffff">KONDOR SAFETY</text>
  <text x="230" y="370" font-size="66" font-weight="700" fill="#0f172a">Guantes anticorte</text>
  <text x="230" y="444" font-size="66" font-weight="700" fill="#0369a1">nivel 5</text>
  <text x="230" y="505" font-size="28" fill="#475569">Nitrilo · Agarre en seco y húmedo</text>
  <text x="230" y="585" font-size="34" fill="#475569">Lleva 3 pares y paga 2</text>
  <text x="230" y="668" font-size="80" font-weight="700" fill="#0f172a">S/ 24.90 <tspan font-size="32" font-weight="400" fill="#475569">c/ par</tspan></text>
  <rect x="230" y="710" width="300" height="72" rx="36" fill="#0369a1"/>
  <text x="380" y="756" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff">Comprar ahora →</text>
